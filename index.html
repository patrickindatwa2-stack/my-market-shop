<!DOCTYPE html>

    <style>
        /* Page background */
body {
    background-color: bisque;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

/* Blue header */
header {
    background-color: #2196F3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Logo section */
.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* Logo image */
.header-left img {
    width: 60px;
    height: auto;
}

/* Logo text */
.logo-text {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

/* Remove underline from logo link */
.header-left a {
    text-decoration: none;
}

/* Navigation tabs */
.nav-tabs {
    display: flex;
    gap: 30px;
}

.nav-tabs a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 5px;
    transition: all 0.3s ease;
    cursor: pointer;
}

/* Hover effect */
.nav-tabs a:hover {
    background-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

/* Active tab */
.nav-tabs a.active {
    background-color: rgba(255, 255, 255, 0.3);
    border-bottom: 2px solid white;
}

/* Content sections */
.content {
    display: none;
    padding: 40px;
    min-height: 80vh;
}

.content.active {
    display: block;
}

/* Home content */
#homeContent {
    text-align: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 10px;
    margin: 20px;
}

#homeContent h1 {
    font-size: 48px;
    margin-top: 100px;
}

#homeContent p {
    font-size: 20px;
    margin-top: 20px;
}

/* About content */
#aboutContent {
    text-align: center;
    background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
    color: white;
    border-radius: 10px;
    margin: 20px;
}

#aboutContent h1 {
    font-size: 48px;
    margin-top: 80px;
}

#aboutContent p {
    font-size: 20px;
    margin: 20px;
}

/* Contact content */
#contactContent {
    text-align: center;
    background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
    color: white;
    border-radius: 10px;
    margin: 20px;
}

#contactContent h1 {
    font-size: 48px;
    margin-top: 80px;
}

#contactContent p {
    font-size: 22px;
    margin: 20px;
}

/* Products grid */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 30px;
    margin-top: 30px;
}

/* Product card */
.product-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    background-color: white;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.product-card img {
    width: 100%;
    max-width: 200px;
    height: auto;
    border-radius: 8px;
}

.product-card h3 {
    margin: 10px 0;
    color: #333;
}

.product-card p {
    color: #2196F3;
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}

/* Buy button */
.product-card a {
    text-decoration: none;
    display: inline-block;
    width: 100%;
}

.buy-btn {
    background-color: #25D366;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    width: 100%;
    transition: background-color 0.3s ease;
}

.buy-btn:hover {
    background-color: #128C7E;
}

/* Responsive design */
@media (max-width: 768px) {
    header {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
    }
    
    .logo-text {
        font-size: 18px;
    }
    
    .nav-tabs {
        gap: 15px;
    }
    
    .nav-tabs a {
        font-size: 14px;
        padding: 6px 12px;
    }
    
    .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
    }
    
    #homeContent h1 {
        font-size: 32px;
    }
    
    #contactContent p {
        font-size: 16px;
    }
}
    </style>
